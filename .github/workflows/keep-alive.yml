name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Portfolio
        run: |
          curl -X GET "https://uvaopvkqpevecrfncwsu.supabase.co/rest/v1/site_settings?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_KEY_PORTFOLIO }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY_PORTFOLIO }}"
      - name: Pink Dokani
        run: |
          curl -X GET "https://mamudqbsskclsehwjzmy.supabase.co/rest/v1/shops?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_KEY_DOKANI }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY_DOKANI }}"
        
